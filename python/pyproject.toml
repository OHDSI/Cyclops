[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "ohdsi-cyclops"
version = "3.7.1.dev0"
description = "Cyclic coordinate descent for large-scale regularized regression (OHDSI Cyclops)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Marc A. Suchard", email = "msuchard@ucla.edu" },
    { name = "Observational Health Data Sciences and Informatics" },
]
keywords = ["regression", "lasso", "cox", "ohdsi", "observational", "epidemiology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# The R package is the numerical ground truth for the parity test-suite.
parity = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/OHDSI/Cyclops"
Issues = "https://github.com/OHDSI/Cyclops/issues"

# ---------------------------------------------------------------------------
# scikit-build-core
# ---------------------------------------------------------------------------

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/cyclops"]
sdist.exclude = [".venv", "build", "**/__pycache__", "**/.pytest_cache"]

[tool.scikit-build.cmake]
version = ">=3.19"
build-type = "Release"

# CYCLOPS_ROOT defaults to the enclosing checkout (see CMakeLists.txt) and can
# be overridden with `-C cmake.define.CYCLOPS_ROOT=...` to build the extension
# against an out-of-tree core.

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "RUF", "NPY", "UP"]
ignore = [
    # `"_cyclops.ModelKind"` — the extension module has no runtime type objects
    # to reference unquoted at class-definition time.
    "UP037",
    # __all__ is grouped by topic, which reads better than alphabetically.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# The R bridge checks `returncode` itself so it can attach R's stderr.
"tests/r_bridge.py" = ["PLW1510", "S603", "S607"]
# conftest puts the tests directory on sys.path before importing from it.
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "parity: compares results against the R Cyclops package (needs R + Cyclops installed)",
    "slow: takes more than a few seconds",
]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
# PyPy has no NumPy/SciPy wheels for our floors, so the test step could never
# install this package's own dependencies there. Windows is skipped because the
# C++ core times itself with POSIX <sys/time.h> and does not build under MSVC.
skip = "pp* *-win*"
test-extras = ["test"]
# {package} is the package directory (python/). {project} is the *repository*
# root, whose tests/ holds the R testthat suite -- pointing pytest there
# collects zero tests and exits 5.
test-command = 'pytest {package}/tests -m "not parity"'
build-verbosity = 1

[tool.cibuildwheel.linux]
# x86_64 covers manylinux and musllinux. aarch64 would need QEMU emulation
# (docker/setup-qemu-action) and takes tens of minutes per wheel for these
# templated kernels, so it belongs in a release workflow rather than every push.
archs = ["x86_64"]

# Build against glibc 2.28, not cibuildwheel's manylinux2014 (glibc 2.17)
# default. For CPython 3.11 and newer the current NumPy and SciPy releases ship
# manylinux_2_28 wheels *only*; pip resolves to the highest version and then
# falls back to that version's sdist rather than downgrading to one with a
# manylinux_2_17 wheel, so the test step tried to compile SciPy from source and
# died on a missing OpenBLAS. Older manylinux_2_17 wheels (all that exists for
# cp39) still install here, since glibc is backward compatible.
#
# The resulting wheels require glibc >= 2.28, which is the floor NumPy and SciPy
# already impose -- claiming 2_17 while our dependencies need 2_28 would have
# been the less honest tag.
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[[tool.cibuildwheel.overrides]]
# arm64 has its own 11.0 floor; only the x86_64 target needs stating, and
# setting it globally would understate the arm64 wheel's minimum.
select = "*-macosx_x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.13" }
